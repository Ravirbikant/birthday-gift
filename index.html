<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <h2>Will you marry me?</h2>
      <div class="buttons">
        <button class="yes-button">Yes</button>
        <button class="hidden"></button>
        <button class="no-button">No</button>
      </div>
    </div>
    <div class="modal" id="celebration-modal" aria-hidden="true">
      <div class="modal-photo"></div>
      <div class="modal-hearts"></div>
      <p class="modal-text">She said yes!</p>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
